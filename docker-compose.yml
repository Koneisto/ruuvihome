services:
  ruuvihome:
    build: .
    container_name: ruuvihome
    hostname: ruuvihome
    restart: unless-stopped
    # Host networking for BlueZ D-Bus access to BLE adapter
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1777
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/ruuvihome", "-healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./config.yml:/config.yml:ro
      - /var/run/dbus:/var/run/dbus
